<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrator - WisataNusantara</title>
  <meta name="description" content="Masuk ke portal dashboard pengelola WisataNusantara.">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body, html {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: linear-gradient(rgba(15, 23, 42, 0.65), rgba(15, 23, 42, 0.85)), 
                  url('https://images.unsplash.com/photo-1516690561799-46d8f74f9abf?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
      position: relative;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      width: 100%;
      max-width: 400px;
      border-radius: var(--radius-xl);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.4);
      padding: 2rem 2.25rem;
      position: relative;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--secondary);
      text-decoration: none;
      margin-bottom: 0.5rem;
    }

    .brand-badge span {
      color: var(--primary);
    }

    .brand-badge svg {
      color: var(--primary);
      width: 1.5rem;
      height: 1.5rem;
    }

    .login-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--secondary);
      margin: 0.25rem 0 0.25rem 0;
    }

    .login-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .test-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #EFF6FF;
      border: 1px solid #BFDBFE;
      border-radius: var(--radius-md);
      padding: 0.5rem 0.75rem;
      font-size: 0.8rem;
      color: #1E40AF;
      margin-bottom: 1.25rem;
    }

    .test-pill code {
      background: #DBEAFE;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-weight: 600;
    }

    .test-pill button {
      background: none;
      border: none;
      color: var(--primary);
      font-weight: 600;
      font-size: 0.775rem;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }

    .test-pill button:hover {
      color: var(--primary-hover);
    }

    .form-group-compact {
      margin-bottom: 1rem;
      text-align: left;
    }

    .form-group-compact .form-label {
      font-size: 0.825rem;
      margin-bottom: 0.35rem;
      display: block;
      font-weight: 600;
      color: var(--text-main);
    }

    .form-group-compact .form-control {
      padding: 0.65rem 0.85rem;
      font-size: 0.9rem;
      border-radius: var(--radius-md);
    }

    .pwd-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .pwd-toggle-btn {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 1rem;
      padding: 0;
      display: flex;
      align-items: center;
    }

    .btn-login {
      margin-top: 1.25rem;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .login-footer {
      text-align: center;
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid #E2E8F0;
    }

    .login-footer a {
      color: var(--text-muted);
      font-size: 0.825rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: var(--transition-fast);
    }

    .login-footer a:hover {
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div style="text-align: center;">
        <a href="/" class="brand-badge">
          <i data-lucide="palmtree"></i>
          <span>Wisata<span style="color: var(--secondary);">Nusantara</span></span>
        </a>
        <h1 class="login-title">Portal Administrator</h1>
        <p class="login-subtitle">Masuk untuk mengelola destinasi & reservasi</p>
      </div>

      <div class="test-pill">
        <div style="display: flex; align-items: center; gap: 0.35rem;">
          <i data-lucide="key-round" style="width: 1rem; height: 1rem;"></i>
          <code>admin</code> / <code>admin123</code>
        </div>
        <button type="button" onclick="fillTestCredentials()">Isi Cepat</button>
      </div>

      <form id="login-form" onsubmit="handleLoginSubmit(event)">
        <div class="form-group-compact">
          <label class="form-label" for="username">Username Admin</label>
          <input type="text" id="username" class="form-control" placeholder="Masukkan username" value="admin" required autofocus>
        </div>

        <div class="form-group-compact">
          <label class="form-label" for="password">Password</label>
          <div class="pwd-wrapper">
            <input type="password" id="password" class="form-control" placeholder="Masukkan password" value="admin123" required>
            <button type="button" class="pwd-toggle-btn" onclick="togglePasswordVisibility()" title="Lihat/Sembunyikan password">
              <i data-lucide="eye" id="eye-icon"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-login-submit" class="btn btn-primary btn-block btn-login">
          <i data-lucide="lock"></i> Masuk ke Dashboard
        </button>
      </form>

      <div class="login-footer">
        <a href="/">
          <i data-lucide="arrow-left"></i> Kembali ke Website
        </a>
      </div>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    // Redirect if already authenticated
    document.addEventListener('DOMContentLoaded', async () => {
      refreshIcons();
      const token = localStorage.getItem('adminToken');
      if (token) {
        try {
          const res = await fetch('/api/auth/verify', {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const result = await res.json();
          if (result.success && result.authenticated) {
            window.location.href = '/dashboard.html';
          }
        } catch (e) {
          localStorage.removeItem('adminToken');
        }
      }
    });

    function fillTestCredentials() {
      document.getElementById('username').value = 'admin';
      document.getElementById('password').value = 'admin123';
      showToast('Kredensial demo terisi!', 'info');
    }

    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        if (eyeIcon) eyeIcon.setAttribute('data-lucide', 'eye-off');
      } else {
        pwdInput.type = 'password';
        if (eyeIcon) eyeIcon.setAttribute('data-lucide', 'eye');
      }
      refreshIcons();
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value;
      const btn = document.getElementById('btn-login-submit');

      if (!usernameInput || !passwordInput) {
        showToast('Username dan password wajib diisi', 'warning');
        return;
      }

      try {
        btn.disabled = true;
        btn.innerHTML = '<i data-lucide="loader-2" style="animation: spin 1s linear infinite;"></i> Memverifikasi...';
        refreshIcons();

        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: usernameInput,
            password: passwordInput
          })
        });

        const result = await res.json();

        if (res.ok && result.success) {
          localStorage.setItem('adminToken', result.token);
          localStorage.setItem('adminUser', JSON.stringify(result.user));
          showToast(result.message || 'Login berhasil!', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 500);
        } else {
          showToast(result.message || 'Username atau password salah', 'error');
        }
      } catch (err) {
        console.error('Login error:', err);
        showToast('Terjadi kesalahan koneksi ke server', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="lock"></i> Masuk ke Dashboard';
        refreshIcons();
      }
    }
  </script>
</body>
</html>
