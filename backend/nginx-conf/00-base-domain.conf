
server {
    listen 80;
    server_name portdock.my.id;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name portdock.my.id;

    ssl_certificate /etc/letsencrypt/live/portdock.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portdock.my.id/privkey.pem;

    include /etc/nginx/portdock-apps/paths/*.conf;
}
