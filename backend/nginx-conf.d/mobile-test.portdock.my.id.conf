
server {
    listen 80;
    server_name mobile-test.portdock.my.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mobile-test.portdock.my.id;

    ssl_certificate /etc/letsencrypt/live/portdock.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portdock.my.id/privkey.pem;

    location / {
        include /etc/nginx/conf.d/maintenance/status.conf;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
