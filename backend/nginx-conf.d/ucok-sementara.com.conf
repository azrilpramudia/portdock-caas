
server {
    listen 80;
    server_name ucok-sementara.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ucok-sementara.com;

    ssl_certificate /etc/letsencrypt/live/ucok-sementara.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ucok-sementara.com/privkey.pem;

    location / {
        include /etc/nginx/conf.d/maintenance/status.conf;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
