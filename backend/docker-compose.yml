version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: portdock_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - portdock_db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  portdock_db_data:
