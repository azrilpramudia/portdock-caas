server {
    server_name api.portdock.my.id;

    # 1. ROUTE AUTH: Izinkan Seluruh API Auth dengan Bulletproof CORS
    location /api/auth/ {
        # --- HANDLING PREFLIGHT REQUEST (OPTIONS) ---
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://portdock.my.id' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Accept, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            return 204;
        }

        # --- BULLETPROOF CORS UNTUK REQUEST SUKSES ---
        # Cegah duplikasi dengan menghapus header bawaan dari Node.js (jika ada)
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Credentials';

        # Paksa Nginx untuk selalu menempelkan header CORS yang sah ke browser user
        add_header 'Access-Control-Allow-Origin' 'https://portdock.my.id' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # --- PROXY KE BACKEND (Port 3000) ---
        proxy_pass http://127.0.0.1:3000;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 10M;
    }

    # 2. ROUTE SWAGGER: Tetap Izinkan Akses Dokumentasi API untuk Testing
    location /api/docs {
        proxy_pass http://127.0.0.1:3000;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. ROUTE PROTEKSI: Blokir Fitur-Fitur Manajemen Docker/Deployment
    location ~* ^/api/(projects|containers|deployments|monitoring|activity-logs|terminal) {
        # Tempelkan izin CORS agar UI Swagger / Frontend bisa membaca pesan error 403 ini
        add_header 'Access-Control-Allow-Origin' 'https://portdock.my.id' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Content-Type' 'application/json' always;
        
        # Mengembalikan format JSON Error 403 khas API
        return 403 "{\"message\":\"Akses fitur deployment dinonaktifkan sementara untuk fase testing.\",\"statusCode\":403}";
    }

    # 4. ROUTE DEFAULT FALLBACK (Rute Utama /)
    location / {
        proxy_pass http://127.0.0.1:3000;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSL Configuration (Managed by Certbot)
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.portdock.my.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.portdock.my.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Blok Pengalihan HTTP ke HTTPS
server {
    if ($host = api.portdock.my.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.portdock.my.id;
    return 404; # managed by Certbot
}
